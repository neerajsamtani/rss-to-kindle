name: rss-to-kindle

services:
  web:
    image: rss-to-kindle:${IMAGE_TAG:?Set IMAGE_TAG in the Pi checkout .env file}
    build:
      context: .
      args:
        RUN_TESTS: "${RUN_TESTS:-0}"
    env_file:
      - path: ./.env.runtime
        format: raw
    environment:
      HOME: /data
      WEB_BASE_PATH: /rss-to-kindle
      WEB_OWNER_LOGIN: neerajjsamtani@gmail.com
      WEB_DB_PATH: /data/jobs.sqlite3
      WEB_DRAIN_TIMEOUT_SECONDS: "180"
    user: "1000:1000"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 240s
    ports:
      - "127.0.0.1:18788:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4); raise SystemExit(0 if json.load(response).get('status') == 'ok' else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
