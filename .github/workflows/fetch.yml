name: Fetch & Send Articles

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - run: uv sync

      - name: Restore sent state
        id: cache-sent
        uses: actions/cache@v4
        with:
          path: ~/.rss-to-kindle/sent.json
          key: sent-state

      - name: Fetch and send articles
        env:
          FEEDS: ${{ secrets.FEEDS }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SUBSTACK_SESSION_COOKIE: ${{ secrets.SUBSTACK_SESSION_COOKIE }}
          SUBSTACK_CONNECT_COOKIES: ${{ secrets.SUBSTACK_CONNECT_COOKIES }}
        run: uv run rss-to-kindle fetch
