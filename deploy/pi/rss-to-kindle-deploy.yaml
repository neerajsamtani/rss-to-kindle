name: rss-to-kindle-deploy
description: Poll public main every five minutes and safely deploy tested commits to the Pi.
schedule: "CRON_TZ=America/New_York */5 * * * *"

# The shared ntfy topic is secret and remains in Dagu's existing secrets file.
dotenv: /home/neerajsamtani/.config/dagu/secrets.env

env:
  - RSS_TO_KINDLE_REPO_DIR: /home/neerajsamtani/rss-to-kindle
  - RSS_TO_KINDLE_DEPLOY_STATE_DIR: /home/neerajsamtani/.local/share/rss-to-kindle-deploy
  - RSS_TO_KINDLE_FAILED_SHA_FILE: /home/neerajsamtani/.config/dagu/.rss-to-kindle-deploy-failed-sha
  - RSS_TO_KINDLE_DEPLOYED_SHA_FILE: /home/neerajsamtani/.config/dagu/.rss-to-kindle-deployed-sha
  - RSS_TO_KINDLE_LOCK_FILE: /home/neerajsamtani/.config/dagu/.rss-to-kindle-deploy.lock

steps:
  - id: deploy
    name: Deploy tested main commit
    command: /home/neerajsamtani/.local/bin/rss-to-kindle-deploy-controller
