[project]
name = "rss-to-kindle"
version = "0.1.0"
description = "Monitor Substack RSS feeds, fetch full paywalled content, and email to Kindle"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "ebooklib>=0.18",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "lxml>=6.0.2",
    "Pillow>=11.0.0",
    "python-dotenv>=1.2.1",
    "readability-lxml>=0.8.4.1",
    "browser-cookie3>=0.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
rss-to-kindle = "rss_to_kindle.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
